<!DOCTYPE html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>BATTLEFRONT LAGOS</title><style>body{margin:0;background:#0a1a0a;color:#0f0;font-family:Arial;overflow:hidden}canvas{width:100vw;height:100vh;display:block;background:#122712}#hud{position:fixed;top:0;left:0;right:0;background:#000c;padding:10px;display:flex;justify-content:space-between;font-weight:bold;border-bottom:2px solid #0f0}#fire{position:fixed;bottom:20px;right:20px;width:110px;height:110px;border-radius:50%;background:red;border:4px solid white;color:white;font-size:20px;font-weight:bold}#move{position:fixed;bottom:20px;left:20px;width:110px;height:110px;border-radius:50%;background:#ffffff22;border:3px solid white}</style></head><body><div id=hud><span>🔫 BATTLEFRONT LAGOS</span><span>KILLS:<b id=k>0</b></span></div><button id=fire>FIRE</button><div id=move></div><canvas id=c></canvas><script>c=document.getElementById('c');x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let kills=0,en=[],bul=[];for(let i=0;i<6;i++)en.push({x:Math.random()*c.width,y:Math.random()*c.height+50,h:100,n:'ENEMY_'+(100+i),dx:(Math.random()-.5)*2,dy:(Math.random()-.5)*2});let px=c.width/2,py=c.height/2;function draw(){x.fillStyle='#1b3a1b';x.fillRect(0,0,c.width,c.height);en.forEach(e=>{e.x+=e.dx;e.y+=e.dy;if(e.x<0||e.x>c.width)e.dx*=-1;if(e.y<60||e.y>c.height)e.dy*=-1;x.fillStyle=e.h<40?'yellow':'red';x.fillRect(e.x-18,e.y-15,36,40);x.fillStyle='white';x.font='10px Arial';x.fillText(e.n,e.x-20,e.y-20);x.fillStyle='black';x.fillRect(e.x-15,e.y-28,30,4);x.fillStyle='lime';x.fillRect(e.x-15,e.y-28,30*e.h/100,4)});bul.forEach((b,i)=>{b.x+=b.dx;b.y+=b.dy;x.fillStyle='yellow';x.beginPath();x.arc(b.x,b.y,5,0,7);x.fill();en.forEach((e,j)=>{if(Math.hypot(b.x-e.x,b.y-e.y)<25){e.h-=34;bul.splice(i,1);if(e.h<=0){en.splice(j,1);kills++;document.getElementById('k').innerText=kills;en.push({x:Math.random()*c.width,y:Math.random()*c.height,h:100,n:'ENEMY_'+Math.floor(Math.random()*900),dx:(Math.random()-.5)*2,dy:(Math.random()-.5)*2})}}})});x.fillStyle='white';x.fillRect(px-2,py-20,4,40);x.fillRect(px-20,py-2,40,4);requestAnimationFrame(draw)}function shoot(){let a=Math.atan2(py-c.height/2,px-c.width/2);bul.push({x:px,y:c.height-80,dx:Math.cos(a)*10,dy:Math.sin(a)*10});if(navigator.vibrate)navigator.vibrate(20)};document.getElementById('fire').onclick=shoot;c.addEventListener('touchmove',e=>{px=e.touches[0].clientX;py=e.touches[0].clientY});c.onclick=shoot;draw();</script></body></html>
