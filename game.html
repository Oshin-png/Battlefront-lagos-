<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BATTLEFRONT LAGOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Impact,Arial}
#c{width:100vw;height:100vh;display:block}
#top{position:fixed;top:0;left:0;right:0;height:50px;background:linear-gradient(#222,#000);border-bottom:3px solid #0f0;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#0f0;z-index:10}
#health{width:120px;height:12px;background:#333;border:1px solid #0f0}
#h{height:100%;width:100%;background:linear-gradient(red,lime)}
#fire{position:fixed;bottom:25px;right:25px;width:110px;height:110px;border-radius:50%;background:radial-gradient(#ff4444,#880000);border:4px solid white;color:white;font:900 18px Arial;box-shadow:0 0 20px red;z-index:10}
#move{position:fixed;bottom:25px;left:25px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,0.15);border:3px solid rgba(255,255,255,0.5);z-index:10}
#aim{position:fixed;top:50%;left:50%;width:30px;height:30px;transform:translate(-50%,-50%);z-index:9}
#aim:before,#aim:after{content:'';position:absolute;background:white}
#aim:before{width:2px;height:30px;left:14px;top:0}
#aim:after{width:30px;height:2px;top:14px;left:0}
</style>
</head>
<body>
<div id="top"><div>🔫 BATTLEFRONT: LAGOS</div><div style="display:flex;gap:10px;align-items:center"><div id="health"><div id="h"></div></div><div>KILLS: <span id="k">0</span></div></div></div>
<div id="aim"></div>
<button id="fire">FIRE</button>
<div id="move"></div>
<canvas id="c"></canvas>
<script>
let cv=document.getElementById('c'),X=cv.getContext('2d');
cv.width=innerWidth;cv.height=innerHeight;
let kills=0,bullets=[],en=[],px=cv.width/2,py=cv.height/2,keys={};
for(let i=0;i<6;i++)en.push({x:Math.random()*cv.width,y:Math.random()*cv.height,hp:100,dx:(Math.random()-0.5)*2,dy:(Math.random()-0.5)*2,name:'ENEMY_'+(100+i)});
function draw(){
X.fillStyle='#1a2f1a';X.fillRect(0,0,cv.width,cv.height);
X.strokeStyle='#0f02';for(let i=0;i<cv.width;i+=50){X.beginPath();X.moveTo(i,0);X.lineTo(i,cv.height);X.stroke()}for(let i=0;i<cv.height;i+=50){X.beginPath();X.moveTo(0,i);X.lineTo(cv.width,i);X.stroke()}
en.forEach(e=>{
  e.x+=e.dx;e.y+=e.dy;if(e.x<0||e.x>cv.width)e.dx*=-1;if(e.y<50||e.y>cv.height)e.dy*=-1;
  X.fillStyle=e.hp<40?'#ff0':'#f00';X.fillRect(e.x-18,e.y-20,36,44);
  X.fillStyle='#fc9';X.beginPath();X.arc(e.x,e.y-28,12,0,Math.PI*2);X.fill();
  X.fillStyle='white';X.font='bold 10px Arial';X.fillText(e.name,e.x-25,e.y-45);
  X.fillStyle='red';X.fillRect(e.x-15,e.y-50,30,4);X.fillStyle='lime';X.fillRect(e.x-15,e.y-50,30*e.hp/100,4);
});
bullets.forEach((b,i)=>{
  b.x+=b.dx;b.y+=b.dy;X.fillStyle='yellow';X.beginPath();X.arc(b.x,b.y,4,0,Math.PI*2);X.fill();
  en.forEach((e,j)=>{
    if(Math.hypot(b.x-e.x,b.y-e.y)<25){e.hp-=34;bullets.splice(i,1);if(e.hp<=0){en.splice(j,1);kills++;document.getElementById('k').textContent=kills;en.push({x:Math.random()*cv.width,y:50+Math.random()*(cv.height-100),hp:100,dx:(Math.random()-0.5)*3,dy:(Math.random()-0.5)*3,name:'ENEMY_'+Math.floor(Math.random()*900)})}if(kills>=15){alert('MISSION COMPLETE! LAGOS SECURED!');location.reload()}}
  })
});
X.fillStyle='#333';X.fillRect(px-20,cv.height-60,40,30);X.fillStyle='#888';X.fillRect(px-25,cv.height-55,50,8);
requestAnimationFrame(draw);
}
cv.addEventListener('touchmove',e=>{px=e.touches[0].clientX;py=e.touches[0].clientY;e.preventDefault()},{passive:false});
function shoot(){
 let ang=Math.atan2(py-cv.height/2,px-cv.width/2);
 bullets.push({x:px,y:cv.height-50,dx:Math.cos(ang)*12,dy:Math.sin(ang)*12});
 cv.style.transform='translate(2px,2px)';setTimeout(()=>cv.style.transform='',50);
 if(navigator.vibrate)navigator.vibrate(30);
}
document.getElementById('fire').onclick=shoot;
cv.onclick=shoot;
draw();
</script>
</body>
</html>
