<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Battlefront Lagos</title>
<style>body{margin:0;background:#111;overflow:hidden}canvas{width:100vw;height:100vh;display:block}
#hud{position:fixed;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;color:#0f0;font:bold 14px Arial;background:rgba(0,0,0,.7)}
#btn{position:fixed;bottom:30px;right:30px;width:100px;height:100px;border-radius:50%;background:rgba(255,0,0,.8);border:3px solid white;color:white;font:bold 20px Arial}
#joy{position:fixed;bottom:30px;left:30px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid white}</style>
</head><body>
<div id="hud"><span>🔫 BATTLEFRONT LAGOS</span><span>KILLS: <b id="k">0</b> | ENEMIES: <b id="e">5</b></span></div>
<button id="btn">FIRE</button><div id="joy"></div>
<canvas id="c"></canvas>
<script>
c=document.getElementById('c');x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
let kills=0,en=[],px=c.width/2,py=c.height/2;
for(let i=0;i<5;i++)en.push({x:Math.random()*c.width,y:Math.random()*c.height,h:100,n:'Player_'+(100+i)});
function draw(){
x.fillStyle='#2a3a2a';x.fillRect(0,0,c.width,c.height);
en.forEach(e=>{
 x.fillStyle=e.h<50?'orange':'red';x.fillRect(e.x-20,e.y-30,40,50);
 x.fillStyle='white';x.font='12px Arial';x.fillText(e.n,e.x-25,e.y-35);
});
x.fillStyle='white';x.fillRect(px-2,py-15,4,30);x.fillRect(px-15,py-2,30,4);
requestAnimationFrame(draw);
}
function fire(){
 let t=en.findIndex(e=>Math.abs(e.x-px)<50&&Math.abs(e.y-py)<60);
 if(t>-1){en[t].h-=50;if(en[t].h<=0){en.splice(t,1);kills++;k.textContent=kills;
 en.push({x:Math.random()*c.width,y:Math.random()*c.height,h:100,n:'Player_'+Math.floor(Math.random()*900)})}e.textContent=en.length;
 if(kills>=10){alert('VICTORY! You cleared Lagos!');location.reload()}} 
}
btn.onclick=fire;c.onclick=fire;
let sx=0,sy=0;c.addEventListener('touchmove',ev=>{px=ev.touches[0].clientX;py=ev.touches[0].clientY});
draw();
</script></body></html>
